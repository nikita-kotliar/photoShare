paths:
  /users/{username}:
    get:
      tags: [Користувачі]
      summary: Публічний профіль
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: Профіль користувача
          content:
            application/json:
              schema:
                type: object
                properties: { user: { $ref: '#/components/schemas/Profile' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{username}/photos:
    get:
      tags: [Користувачі]
      summary: Світлини користувача
      description: >-
        Нові першими. Доступно без входу; з валідною сесією у світлинах
        заповнено myRating.
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Сторінка світлин
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{username}/achievements:
    get:
      tags: [Користувачі]
      summary: Досягнення користувача
      description: >-
        Публічно. Усі п'ять досягнень у фіксованому порядку: FIRST_PHOTO (перша світлина),
        TEN_PHOTOS (10 публікацій), COMMENTATOR (20 коментарів), CRITIC (50 оцінок),
        FAVORITE (середній рейтинг світлин 4.5+ від щонайменше 5 оцінок). Отримані мають earnedAt.
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: Досягнення
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum: [FIRST_PHOTO, TEN_PHOTOS, COMMENTATOR, CRITIC, FAVORITE]
                        earned: { type: boolean }
                        earnedAt: { type: string, format: date-time, nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
