paths:
  /password/forgot:
    post:
      tags: [Автентифікація]
      summary: Забули пароль - надіслати лист
      description: >-
        Надсилає лист з одноразовим посиланням (діє 1 годину) на сторінку /reset-password сайту.
        Відповідь однакова, чи є такий акаунт, чи ні. Забаненим лист не надсилається.
        5 запитів на годину з однієї адреси. На проді без SMTP - 503 MAIL_UNAVAILABLE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: nikita@example.com }
      responses:
        '200':
          description: Лист надіслано, якщо акаунт існує
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Забагато запитів (RATE_LIMIT) }
        '503': { description: Пошта не налаштована (MAIL_UNAVAILABLE) }

  /password/reset:
    post:
      tags: [Автентифікація]
      summary: Задати новий пароль за посиланням з листа
      description: >-
        Токен з посилання одноразовий. Після успіху користувач одразу в акаунті (cookie сесії).
        Акаунт лише з Google отримує пароль і може входити ним.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, pattern: '^[0-9a-f]{64}$' }
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        '200':
          description: Пароль змінено, cookie встановлено
          content:
            application/json:
              schema:
                type: object
                properties: { user: { $ref: '#/components/schemas/User' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Забагато спроб (RATE_LIMIT) }
