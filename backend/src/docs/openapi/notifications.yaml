paths:
  /notifications:
    get:
      tags: [Сповіщення]
      summary: Мої сповіщення
      description: >-
        Нові першими. Типи - COMMENT (коментар до моєї світлини, data - commentId і text),
        RATING (оцінка моєї світлини, data - value), ACHIEVEMENT (нове досягнення, data - code,
        actor - null), MODERATOR (мене призначили модератором). Про власні дії сповіщень немає.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Сторінка сповіщень
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /notifications/unread-count:
    get:
      tags: [Сповіщення]
      summary: Кількість непрочитаних
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Лічильник для дзвіночка
          content:
            application/json:
              schema:
                type: object
                properties: { count: { type: integer, example: 3 } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/read:
    post:
      tags: [Сповіщення]
      summary: Позначити прочитаними
      description: Без ids - усі мої сповіщення. Чужі id ігноруються.
      security: [{ cookieAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Скільки позначено і скільки лишилося непрочитаних
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
                  unread: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
