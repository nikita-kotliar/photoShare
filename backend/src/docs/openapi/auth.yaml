paths:
  /users:
    post:
      tags: [Автентифікація]
      summary: Реєстрація
      description: Перший зареєстрований користувач отримує роль ADMIN. Після реєстрації користувач одразу в акаунті (D-02).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  {
                    type: string,
                    minLength: 3,
                    maxLength: 30,
                    pattern: '^[a-zA-Z0-9_.-]+$',
                    example: nikita,
                  }
                email: { type: string, format: email, example: nikita@example.com }
                password: { type: string, minLength: 8, maxLength: 72, example: password123 }
                name:
                  {
                    type: string,
                    minLength: 1,
                    maxLength: 60,
                    description: За замовчуванням дорівнює username,
                  }
      responses:
        '201':
          description: Користувача створено, cookie встановлено
          headers:
            Set-Cookie:
              { schema: { type: string, example: token=eyJ...; Path=/; HttpOnly; SameSite=Lax } }
          content:
            application/json:
              schema:
                type: object
                properties: { user: { $ref: '#/components/schemas/User' } }
        '409':
          description: email або username вже зайняті
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: CONFLICT,
                      message: Користувач вже існує,
                      fields: { email: Користувач з таким email вже існує },
                    },
                }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/me:
    get:
      tags: [Автентифікація]
      summary: Поточний користувач
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Дані користувача
          content:
            application/json:
              schema:
                type: object
                properties: { user: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Користувачі]
      summary: Редагувати свій профіль
      description: >-
        Потрібне хоча б одне поле. Роль, статус і пароль тут не змінюються.
        Після зміни email вхід працює лише з новим, сесія лишається.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 60, example: Нікіта }
                username:
                  {
                    type: string,
                    minLength: 3,
                    maxLength: 30,
                    pattern: '^[a-zA-Z0-9_.-]+$',
                    example: nikita,
                  }
                email: { type: string, format: email, example: nikita@example.com }
                bio:
                  {
                    type: string,
                    maxLength: 300,
                    description: 'Порожній рядок очищає поле',
                    example: Люблю фотографувати море,
                  }
      responses:
        '200':
          description: Профіль оновлено
          content:
            application/json:
              schema:
                type: object
                properties: { user: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: email або username вже зайняті
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error:
                    {
                      code: CONFLICT,
                      message: Користувач вже існує,
                      fields: { username: Цей юзернейм вже зайнятий },
                    },
                }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sessions:
    get:
      tags: [Автентифікація]
      summary: Поточна сесія
      description: >-
        Для старту сайту. Гостю, після виходу і забаненому - 200 з user null (а не 401), тож
        браузер не пише помилку в консоль.
      responses:
        '200':
          description: Користувач або null
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { allOf: [{ $ref: '#/components/schemas/User' }], nullable: true }
    post:
      tags: [Автентифікація]
      summary: Вхід
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: nikita@example.com }
                password: { type: string, example: password123 }
      responses:
        '200':
          description: Вхід виконано, cookie встановлено
          headers:
            Set-Cookie:
              { schema: { type: string, example: token=eyJ...; Path=/; HttpOnly; SameSite=Lax } }
          content:
            application/json:
              schema:
                type: object
                properties: { user: { $ref: '#/components/schemas/User' } }
        '401':
          description: Невірний email або пароль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: INVALID_CREDENTIALS, message: Невірний email або пароль } }
        '403':
          description: Акаунт заблоковано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: USER_BANNED, message: Акаунт заблоковано } }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Автентифікація]
      summary: Вихід
      description: Очищає cookie, токен потрапляє в blacklist до кінця свого життя. Інші сесії користувача працюють далі (D-36). Без cookie або з битим токеном теж 204.
      responses:
        '204': { $ref: '#/components/responses/NoContent' }

  /auth/google:
    get:
      tags: [Автентифікація]
      summary: Вхід через Google
      description: >-
        Відкривається браузером, не fetch. Перенаправляє на сторінку згоди Google (OAuth 2.0
        з PKCE), state зберігається в короткій httpOnly cookie. Якщо Google не налаштовано,
        одразу повертає на сайт з googleError=unavailable.
      responses:
        '302': { description: Перехід на Google або назад на сайт з помилкою }

  /auth/google/callback:
    get:
      tags: [Автентифікація]
      summary: Повернення від Google
      description: >-
        Сюди повертає Google. Знаходить користувача за Google id або підтвердженим email
        (прив'язує акаунт) чи створює новий без пароля. Успіх - cookie сесії і перехід на /home
        сайту. Помилка - перехід на /auth?googleError=cancelled | banned | email_unverified |
        unavailable, без cookie.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string, example: access_denied } }
      responses:
        '302': { description: Перехід на /home з cookie або на /auth з кодом помилки }

  /health:
    get:
      tags: [Сервіс]
      summary: Перевірка стану сервера
      responses:
        '200':
          description: Сервер працює
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  uptime: { type: number, description: Секунди з моменту запуску }
