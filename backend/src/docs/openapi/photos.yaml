paths:
  /photos:
    get:
      tags: [Світлини]
      summary: Стрічка світлин
      description: Нові першими.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Сторінка світлин
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Світлини]
      summary: Завантажити світлину
      description: Файл одразу йде в Cloudinary. Тип перевіряється за вмістом файлу, а не за розширенням. Теги нормалізуються до нижнього регістру (D-09).
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, description]
              properties:
                image:
                  { type: string, format: binary, description: JPEG / PNG / WEBP / GIF до 10 МБ }
                description: { type: string, minLength: 1, maxLength: 1000 }
                tags:
                  {
                    type: string,
                    description: 'До 5 тегів по 1-30 символів: JSON-масив або через кому',
                    example: 'nature, sea',
                  }
                transformations:
                  {
                    type: string,
                    description: JSON-рядок з набором трансформацій,
                    example: '{"effect":"sepia"}',
                  }
      responses:
        '201':
          description: Світлину створено
          content:
            application/json:
              schema:
                type: object
                properties: { photo: { $ref: '#/components/schemas/Photo' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: Файл більший за 10 МБ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                { error: { code: PAYLOAD_TOO_LARGE, message: Файл завеликий (максимум 10 МБ) } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /photos/{id}:
    get:
      tags: [Світлини]
      summary: Одна світлина
      description: Доступна без входу за числовим id або за slug (D-14).
      parameters:
        - name: id
          in: path
          required: true
          description: Числовий id або slug
          schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,64}$' }
          example: aB3_xY9-kLmN
      responses:
        '200':
          description: Світлина
          content:
            application/json:
              schema:
                type: object
                properties: { photo: { $ref: '#/components/schemas/Photo' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    put:
      tags: [Світлини]
      summary: Змінити опис і теги
      description: Лише власник або ADMIN. Без поля tags теги не змінюються.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string, minLength: 1, maxLength: 1000 }
                tags:
                  { type: array, maxItems: 5, items: { type: string, minLength: 1, maxLength: 30 } }
      responses:
        '200':
          description: Оновлена світлина
          content:
            application/json:
              schema:
                type: object
                properties: { photo: { $ref: '#/components/schemas/Photo' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Світлини]
      summary: Видалити світлину
      description: Лише власник або ADMIN. Разом зі світлиною видаляються коментарі й посилання, файл - з Cloudinary (D-15).
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /photos/{id}/links:
    get:
      tags: [Трансформації і QR]
      summary: Збережені посилання світлини
      description: Нові першими.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Список посилань
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Link' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Трансформації і QR]
      summary: Створити посилання з трансформаціями і QR-кодом
      description: Лише власник або ADMIN. Оригінал не змінюється, посилання будується від оригіналу (D-22). Потрібна хоча б одна трансформація.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transformations]
              properties:
                transformations: { $ref: '#/components/schemas/Transformations' }
      responses:
        '201':
          description: Посилання створено
          content:
            application/json:
              schema:
                type: object
                properties: { link: { $ref: '#/components/schemas/Link' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
