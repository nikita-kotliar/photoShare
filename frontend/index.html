<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="PhotoShare - платформа для обміну світлинами: завантажуйте фото, додавайте теги й ефекти, оцінюйте та коментуйте роботи інших."
    />
    <meta name="theme-color" content="#132d62" />
    <title>PhotoShare</title>
    <script>
      try {
        const theme = localStorage.getItem('photoshare-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
