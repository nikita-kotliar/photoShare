location = /photoshare { return 301 /photoshare/; }

location ^~ /photoshare/assets/ {
    alias /var/www/photoshare/assets/;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location ^~ /photoshare/ {
    alias /var/www/photoshare/;
    try_files $uri $uri/ /photoshare/index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;
}

location ^~ /photoshare-api/ {
    proxy_pass http://127.0.0.1:8100/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 12m;
    add_header X-Robots-Tag "noindex" always;
}
