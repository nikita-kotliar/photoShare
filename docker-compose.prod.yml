name: photoshare

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: photoshare
      POSTGRES_USER: photoshare
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U photoshare -d photoshare']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://photoshare:${DB_PASSWORD}@db:5432/photoshare
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-https://kotdenik.cx.ua}
      COOKIE_NAME: photoshare_token
      COOKIE_PATH: /photoshare-api/
      PUBLIC_API_PATH: /photoshare-api
    ports:
      - '127.0.0.1:${API_PORT:-8100}:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 384m

volumes:
  pgdata:
